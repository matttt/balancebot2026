; PlatformIO Project Configuration
;
; One project, one environment per entry point. Each [env:*] compiles exactly
; one main() via build_src_filter and shows up in the VSCode PlatformIO sidebar
; with its own Build / Upload / Monitor tasks.
;
; To add a demo: drop src/apps/<name>.cpp, add a 3-line [env:<name>] block, and
; (optionally) a matching tools/<name>.py dashboard.
;
; Per-developer board / serial port settings live in platformio_local.ini
; (git-ignored). Copy platformio_local.ini.example to get started.

[platformio]
default_envs = main
extra_configs = platformio_local.ini

; Shared defaults for every environment. `board` is the default; override it
; (and the serial ports) for your hardware in platformio_local.ini.
[env]
platform = teensy
framework = arduino
board = teensy41
monitor_speed = 115200
build_flags =
    -std=gnu++17
    -O2
    -Wall

; ── Robot firmware ──
[env:main]
build_src_filter = +<main.cpp>
lib_deps = https://github.com/tonton81/FlexCAN_T4.git

; ── Dev / debug demos ──
[env:ekf_demo]
build_src_filter = +<apps/ekf_demo.cpp>

[env:imu_demo]
build_src_filter = +<apps/imu_demo.cpp>

[env:hip_demo]
build_src_filter = +<apps/hip_demo.cpp>
lib_deps = https://github.com/tonton81/FlexCAN_T4.git

[env:balance_demo]
build_src_filter = +<apps/balance_demo.cpp>
lib_deps = https://github.com/tonton81/FlexCAN_T4.git
